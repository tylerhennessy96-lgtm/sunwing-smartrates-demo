<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packages — Sunwing RMS</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="chart.local.js"></script>
  <script src="data.js"></script>
  <script src="vendor/papaparse.min.js"></script>
  <script src="data-loader.js"></script>
  <script src="filters.js"></script>
  <style>
    /* ── Flight category pills (OWN / RSK / 3RD) ─────────────── */
    .flight-cat {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid transparent;
      letter-spacing: .2px;
    }
    .flight-cat-own        { background: rgba(233,30,140,0.10); color: #c2185b; border-color: rgba(233,30,140,0.35); }
    .flight-cat-risk       { background: rgba(245,166,35,0.14); color: #b45309; border-color: rgba(245,166,35,0.35); }
    .flight-cat-thirdparty { background: #f3f4f6; color: var(--text-secondary); border-color: var(--border); }

    /* ── Hotel classification pills (EXC / COM) ──────────────── */
    .hotel-cls {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid transparent;
      letter-spacing: .2px;
    }
    .hotel-cls-exc { background: rgba(233,30,140,0.08); color: #b01867; border-color: rgba(233,30,140,0.28); }
    .hotel-cls-com { background: #f3f4f6;                color: var(--text-secondary); border-color: var(--border); }

    /* ── Duration pill (7N / 10N / 14N) ──────────────────────── */
    .dur-pill {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: #f3f4f6;
      color: var(--text-primary);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
    }

    /* ── Stacked cat/cls cell ────────────────────────────────── */
    .cat-cls-stack {
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-start;
    }

    /* ── Star rating ─────────────────────────────────────────── */
    .star-rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .star-icon {
      position: relative;
      display: inline-block;
      width: 12px;
      height: 12px;
      line-height: 0;
    }
    .star-icon svg { display: block; width: 12px; height: 12px; }
    .star-icon .star-fg {
      position: absolute;
      top: 0;
      left: 0;
      height: 12px;
      overflow: hidden;
    }
    .star-num { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* ── Package row name cell (2-line layout) ───────────────── */
    .pkg-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
    }
    .pkg-name .pkg-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 12.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pkg-name .pkg-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .pkg-name .pkg-meta .pkg-meta-sep { color: var(--border-mid); margin: 0 5px; }
    .cost-change-icon {
      color: var(--warn);
      font-size: 11px;
      vertical-align: middle;
      cursor: help;
    }

    /* ── Legend bar ──────────────────────────────────────────── */
    .legend-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 20px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .legend-bar .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-bar .legend-sep  { color: var(--border); }

    /* ── View switching ──────────────────────────────────────── */
    .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* ── Rec-price clickable hint ────────────────────────────── */
    .rec-click {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background .12s;
    }
    .rec-click:hover { background: rgba(232, 0, 125, 0.10); }
    .rec-click.accepted { color: var(--text-muted); font-weight: 500; text-decoration: line-through; cursor: default; }

    /* ── Package Rules drawer (separate from adv-drawer) ─────── */
    .pkg-rules-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 24px rgba(0,0,0,.18);
      display: none;
      flex-direction: column;
      z-index: 70;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(0.4,0,0.2,1);
    }
    .pkg-rules-drawer.open { display: flex; transform: translateX(0); }
    .pkg-rules-drawer .prd-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .pkg-rules-drawer .prd-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .pkg-rules-drawer .prd-sub   { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
    .pkg-rules-drawer .prd-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 2px 4px;
    }
    .pkg-rules-drawer .prd-close:hover { color: var(--text-primary); }
    .pkg-rules-drawer .prd-section {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .pkg-rules-drawer .prd-section-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .prd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .prd-row label {
      font-size: 12px;
      color: var(--text-secondary);
      flex: 1;
    }
    .prd-row input[type="number"] {
      width: 96px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-family: var(--font-sans);
      outline: none;
    }
    .prd-row input[type="number"]:focus { border-color: var(--accent); }
    .prd-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .prd-toggle input { accent-color: var(--accent); cursor: pointer; }
    .prd-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fafbfc;
    }
    .prd-meta { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

    /* ── Run Evaluation modal + toast ────────────────────────── */
    .re-backdrop {
      position: fixed; inset: 0;
      background: rgba(17, 20, 27, 0.55);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .re-backdrop.open { display: flex; }
    .re-modal {
      background: #fff;
      border-radius: 10px;
      width: 520px;
      max-width: calc(100vw - 40px);
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      font-family: var(--font-sans);
      color: var(--text-primary);
      overflow: hidden;
    }
    .re-modal-head {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .re-modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .re-modal-close {
      background: none; border: none; font-size: 20px; line-height: 1;
      color: var(--text-muted); cursor: pointer;
      padding: 4px 8px; border-radius: 4px;
    }
    .re-modal-close:hover { color: var(--text-primary); background: #f3f4f6; }
    .re-modal-body {
      padding: 18px 22px;
      overflow-y: auto;
      flex: 1;
    }
    .re-modal-section { margin-bottom: 18px; }
    .re-modal-section:last-child { margin-bottom: 0; }
    .re-modal-section-title {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .re-intro { font-size: 12px; color: var(--text-secondary); margin: 0 0 8px; }
    .re-modal-cb {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-primary);
      cursor: pointer;
      padding: 5px 0;
    }
    .re-modal-cb input { margin-top: 2px; cursor: pointer; accent-color: var(--accent); }
    .re-destlist, .re-gatewaylist, .re-durlist {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 10px;
      margin-top: 6px;
      padding: 8px 10px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 140px;
      overflow-y: auto;
    }
    .re-destlist label, .re-gatewaylist label, .re-durlist label {
      font-size: 11.5px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .re-preview {
      background: rgba(232, 0, 125, 0.06);
      border: 1px solid rgba(232, 0, 125, 0.28);
      border-radius: 6px;
      padding: 11px 14px;
      font-size: 12.5px;
      color: #b01867;
    }
    .re-preview strong { color: var(--accent); font-weight: 700; }
    .re-modal-foot {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fafbfc;
    }
    .re-btn {
      padding: 8px 18px;
      border-radius: 5px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .re-btn.ghost   { background: #fff; color: var(--text-primary); }
    .re-btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .re-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .re-btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }

    .re-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #16181d;
      color: #e5e7eb;
      border: 1px solid #2d313b;
      border-radius: 8px;
      padding: 11px 18px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 220;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .re-toast.shown { opacity: 1; transform: translateX(-50%) translateY(0); }
    .re-toast .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(232, 0, 125, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: reSpin 0.9s linear infinite;
    }
    .re-toast.success .spinner { display: none; }
    .re-toast .check { display: none; color: var(--accent); font-weight: 700; }
    .re-toast.success .check { display: inline; }
    @keyframes reSpin { to { transform: rotate(360deg); } }

    /* ── Action icons (reuse .pkg-action-icons from styles.css) ─ */
    .pkg-action-icons button.locked { color: var(--accent); background: rgba(232, 0, 125, 0.10); }

    /* ── Regular ("was") price under the editable price input ── */
    .price-was {
      font-size: 10.5px;
      color: var(--text-muted);
      text-decoration: line-through;
      font-family: var(--font-mono);
      margin-top: 2px;
    }

    /* ── Book channel buttons (Revnet / WEB) ─────────────────── */
    .book-btns {
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
    }
    .book-btns button {
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-mid);
      background: #f9fafb;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color .12s, color .12s;
    }
    .book-btns button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Top Nav ── -->
  <nav class="topnav">
    <a href="pricing.html" class="logo" style="text-decoration:none;">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="engine_logo (2).png" style="height:28px;width:auto;display:block;" />
        <div style="display:flex;flex-direction:column;line-height:1;gap:2px;">
          <span style="font-family:var(--font-sans);font-size:13px;font-weight:700;letter-spacing:0.5px;color:#ffffff;">DYNAMICA</span>
          <span style="font-family:var(--font-sans);font-size:10px;font-weight:400;letter-spacing:0.5px;color:rgba(255,255,255,0.6);">SmartRates</span>
        </div>
      </div>
    </a>

    <div class="nav-tabs">
      <a href="pricing.html"    class="nav-tab active">Pricing</a>
      <a href="parameters.html" class="nav-tab">Parameters</a>
    </div>

    <div class="nav-divider"></div>

    <div style="position:relative;">
      <button class="nav-menu-btn" id="menuBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-dropdown" id="navDropdown">
        <a href="#">Settings</a>
        <a href="#">Reports</a>
      </div>
    </div>
  </nav>

  <!-- ── Filter Bar ── -->
  <div class="filter-bar" id="filterBar">
    <div class="ms-wrap" id="fBrand">
      <button class="ms-trigger" onclick="toggleFilter('fBrand')">
        <span>All Brands</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fRegion">
      <button class="ms-trigger" onclick="toggleFilter('fRegion')">
        <span>All Regions</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fDestination">
      <button class="ms-trigger" onclick="toggleFilter('fDestination')">
        <span>All Destinations</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fHotel">
      <button class="ms-trigger" onclick="toggleFilter('fHotel')">
        <span>All Hotels</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fGateway">
      <button class="ms-trigger" onclick="toggleFilter('fGateway')">
        <span>All Gateways</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fNights">
      <button class="ms-trigger" onclick="toggleFilter('fNights')">
        <span>All Nights</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
    <div class="ms-wrap" id="fDates">
      <button class="date-pill" onclick="toggleFilter('fDates')">
        <svg class="cal" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2" y="3" width="10" height="9" rx="1"/>
          <line x1="2" y1="6" x2="12" y2="6"/>
          <line x1="5" y1="1.5" x2="5" y2="4"/>
          <line x1="9" y1="1.5" x2="9" y2="4"/>
        </svg>
        <span class="date-range-text" id="fDatesLabel">Select weeks</span>
      </button>
      <div class="date-pill-popover"></div>
    </div>
    <div class="ms-wrap" id="fRM">
      <button class="ms-trigger" onclick="toggleFilter('fRM')">
        <span>All RMs</span>
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="ms-dropdown"><div class="ms-options"></div></div>
    </div>
  </div>

  <!-- ── Sub-tab Bar ── -->
  <div class="subtab-bar">
    <!-- Flight Only / Hotel Only temporarily hidden while those tabs are in development -->
    <!-- <a href="flight.html"  class="subtab">Flight Only</a> -->
    <!-- <a href="hotel.html"   class="subtab">Hotel Only</a> -->
    <a href="pricing.html" class="subtab active">Packages</a>
    <div class="subtab-spacer"></div>
    <button class="btn btn-primary" onclick="runEvaluation()" style="margin-right:8px;">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="3,2 12,7 3,12" fill="currentColor" stroke="none"/></svg>
      Run Evaluation
    </button>
    <button class="btn btn-ghost" onclick="publishChanges()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7h10M7 2l5 5-5 5"/></svg>
      Publish Changes
    </button>
  </div>


  <!-- ── Main: Views ── -->
  <div class="main">

    <!-- Packages table view -->
    <div class="view" id="viewRecs">
      <div class="table-wrap">
        <table class="data-table" id="packagesTable">
          <thead id="packagesHead"></thead>
          <tbody id="packagesBody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /.main -->

</div><!-- /.app -->

<!-- ── Per-Package Rules Drawer ── -->
<div class="adv-backdrop" id="prdBackdrop" onclick="closePkgRules()"></div>
<aside class="pkg-rules-drawer" id="pkgRulesDrawer" aria-hidden="true">
  <div class="prd-header">
    <div>
      <div class="prd-title">Package Rules</div>
      <div class="prd-sub" id="prdSub">—</div>
    </div>
    <button class="prd-close" type="button" aria-label="Close" onclick="closePkgRules()">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
    </button>
  </div>

  <div class="prd-section">
    <div class="prd-section-title">Price Bounds</div>
    <div class="prd-row">
      <label>Min price ($)</label>
      <input type="number" id="prdMinPrice" placeholder="—" />
    </div>
    <div class="prd-row">
      <label>Max price ($)</label>
      <input type="number" id="prdMaxPrice" placeholder="—" />
    </div>
  </div>

  <div class="prd-section">
    <div class="prd-section-title">Margin Bounds</div>
    <div class="prd-row">
      <label>Min margin ($)</label>
      <input type="number" id="prdMinMargin" placeholder="—" />
    </div>
    <div class="prd-row">
      <label>Max margin ($)</label>
      <input type="number" id="prdMaxMargin" placeholder="—" />
    </div>
  </div>

  <div class="prd-section">
    <div class="prd-section-title">Controls</div>
    <label class="prd-toggle">
      <input type="checkbox" id="prdLock" /> Lock price (no rec changes)
    </label>
    <label class="prd-toggle" style="margin-top:6px;">
      <input type="checkbox" id="prdFlag" /> Flag changes &gt; $50 for review
    </label>
  </div>

  <div class="prd-section">
    <div class="prd-section-title">Last Modified</div>
    <div class="prd-meta" id="prdMeta">—</div>
  </div>

  <div class="prd-footer">
    <button class="re-btn ghost"   type="button" onclick="closePkgRules()">Cancel</button>
    <button class="re-btn primary" type="button" onclick="savePkgRules()">Save</button>
  </div>
</aside>

<!-- ── Notes Modal ── -->
<div class="modal-backdrop" id="notesModalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Package notes</div>
        <div class="modal-subtitle" id="notesModalSub">—</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════════════════════ */
const priceOverrides   = {};         // pkgId → price (user edits / accepted rec)
const lockedPkgs       = new Set();  // pkgId (🔒 fixed)
const acceptedRecs     = new Set();  // pkgId (rec was accepted)
const pkgRules         = {};         // pkgId → { minPrice, maxPrice, minMargin, maxMargin, lock, flag, modifiedAt, modifiedBy }
const notes            = {};         // pkgId → { text, expires, createdBy, createdAt }

let activeRuleKey = null;
let activeNoteKey = null;
let priceRevision = 0;
let packageFilterKey = '';
let visibleRowLimit = 250;

const ROW_RENDER_BATCH = 250;
const packageIndex = {
  root: { _leaves: [] },
  byId: new Map(),
  destById: new Map(),
};

/* ══════════════════════════════════════════════════════════════════
   Helpers
   ══════════════════════════════════════════════════════════════════ */
function fmt$(n)  { return '$' + Math.round(n).toLocaleString(); }
function fmtPct(f){ return Math.round(f * 100) + '%'; }
function fmtPctN(n){ return (Math.round(n * 10) / 10) + '%'; }
function avg(arr, key) {
  if (!arr.length) return 0;
  return arr.reduce((s, x) => s + (typeof key === 'function' ? key(x) : x[key]), 0) / arr.length;
}
function sum(arr, key) {
  return arr.reduce((s, x) => s + (typeof key === 'function' ? key(x) : x[key]), 0);
}
function chevron(open) {
  return `<svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" style="transform:${open?'rotate(90deg)':'none'};transition:transform .15s;"><polyline points="4,2 8,6 4,10"/></svg>`;
}
function regionClass(region) {
  const map = { 'Caribbean': 'region-caribbean', 'Mexico': 'region-mexico', 'Central America': 'region-centralamerica', 'Europe': 'region-europe', 'Sun & Sand': 'region-sunsand' };
  return map[region] || 'region-caribbean';
}
function flightCatBadge(cat) {
  const cls  = cat === 'Own Flight' ? 'own' : cat === 'Risk Block' ? 'risk' : 'thirdparty';
  const abbr = cat === 'Own Flight' ? 'OWN' : cat === 'Risk Block' ? 'RSK' : '3RD';
  return `<span class="flight-cat flight-cat-${cls}" title="${cat}">${abbr}</span>`;
}
function hotelClsBadge(cls) {
  const key = cls === 'EXC' ? 'exc' : 'com';
  const full = cls === 'EXC' ? 'Exclusive' : 'Commodity';
  return `<span class="hotel-cls hotel-cls-${key}" title="${full}">${cls}</span>`;
}
function durPill(d) {
  return `<span class="dur-pill">${d}N</span>`;
}
function weekShort(dateText) {
  const s = String(dateText || '').trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${Number(m[2])}-${months[Number(m[1]) - 1] || m[1]}`;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${Number(m[3])}-${months[Number(m[2]) - 1] || m[2]}`;
  }
  return s;
}
// "2026-07-11" or "7/11/26" → "JUL 11" (matches the booking-results layout).
function dayMon(dateText) {
  const s = String(dateText || '').trim();
  if (!s) return '';
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${months[Number(m[2]) - 1] || m[2]} ${Number(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) return `${months[Number(m[1]) - 1] || m[1]} ${Number(m[2])}`;
  return s;
}
const _STAR_SVG = '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M6 0.5 L7.55 4.05 L11.4 4.5 L8.5 7.15 L9.3 11 L6 9.05 L2.7 11 L3.5 7.15 L0.6 4.5 L4.45 4.05 Z"/></svg>';
function starRating(stars) {
  const rating = Math.max(0, Math.min(5, Number(stars) || 0));
  const pct = (rating / 5) * 100;
  return `<span class="star-rating" title="Rating ${rating.toFixed(1)} / 5">
    <span class="star-icon">
      <span style="color:#d1d5db;">${_STAR_SVG}</span>
      <span class="star-fg" style="width:${pct}%;color:#e91e8c;">${_STAR_SVG}</span>
    </span>
    <span class="star-num">${rating.toFixed(1)}</span>
  </span>`;
}
function paceBadge(pace) {
  const map = {
    'ahead':    { cls: 'pace-ahead',   label: 'Ahead' },
    'on track': { cls: 'pace-ontrack', label: 'On Track' },
    'behind':   { cls: 'pace-behind',  label: 'Behind' },
  };
  const b = map[pace] || map['on track'];
  return `<span class="pace-badge ${b.cls}">${b.label}</span>`;
}
function getEffectivePrice(pkg) {
  if (priceOverrides[pkg.id] != null) return priceOverrides[pkg.id];
  return pkg.currentPrice;
}
function getEffectiveMargin(pkg) {
  return getEffectivePrice(pkg) - pkg.totalCost;
}
function deltaColor(delta) {
  if (delta > 0) return 'delta-pos';
  if (delta < 0) return 'delta-neg';
  return 'text-muted';
}

/* ══════════════════════════════════════════════════════════════════
   Filter matching + tree walkers
   ══════════════════════════════════════════════════════════════════ */
// Mirror the week picker's Monday-anchored weeks (filters.js getMonday) so a
// package's Sunday week_start maps to the same Monday the calendar row selects.
function mondayOf(isoOrDate) {
  const d = isoOrDate instanceof Date ? new Date(isoOrDate) : new Date(String(isoOrDate) + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const day = d.getDay();
  const offset = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + offset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function passesHeaderFilters(pkg) {
  if (typeof Filters === 'undefined' || !Filters.getActiveFilters) return true;
  const f = Filters.getActiveFilters();
  const dest = packageIndex.destById.get(String(pkg.destId));
  if (f.brand && f.brand.length && dest && !f.brand.includes(dest.brand)) return false;
  if (f.region && f.region.length && !f.region.includes(pkg.region)) return false;
  if (f.destination && f.destination.length && !f.destination.includes(pkg.destination)) return false;
  if (f.rm && f.rm.length && dest && !f.rm.includes(dest.revenueManager)) return false;
  // Package-specific filters (not part of the shared filter bar contract).
  const hotels = Filters.getSelected('fHotel');
  if (hotels.length && !hotels.includes(pkg.hotel)) return false;
  const gateways = Filters.getSelected('fGateway');
  if (gateways.length && !gateways.includes(pkg.gatewayCity)) return false;
  const nights = Filters.getSelected('fNights');
  if (nights.length && !nights.includes(`${pkg.duration}N`)) return false;
  // Week range — compare on the picker's Monday anchor so the Sunday-based
  // package week_start lines up with the selected calendar weeks.
  if (f.dates && f.dates.start) {
    const wkMon = mondayOf(pkg.weekStartIso);
    const lo = mondayOf(f.dates.start);
    const hi = mondayOf(f.dates.end || f.dates.start);
    if (!wkMon || !lo || !hi) return false;
    const t = wkMon.getTime();
    if (t < lo.getTime() || t > hi.getTime()) return false;
  }
  return true;
}

function rebuildPackageIndex() {
  packageIndex.root = { _leaves: [] };
  packageIndex.byId = new Map();
  packageIndex.destById = new Map();

  DESTINATIONS.forEach(d => packageIndex.destById.set(String(d.id), d));

  // Flatten the nested CSV structure (dest → week → gateway → durations) into a
  // single ordered list of package leaves — the table is now one row per package.
  PACKAGE_DATA.forEach(dest => {
    dest._leaves = [];
    dest.checkInWeeks.forEach(wk => {
      wk.gateways.forEach(gw => {
        gw.durations.forEach(pkg => {
          pkg.gatewayCity = pkg.gatewayCity || gw.gatewayCity || pkg.gateway;
          pkg.weekLabel = pkg.weekLabel || wk.label || pkg.checkInWeek;
          pkg.weekDate = pkg.weekDate || wk.date || pkg.checkInDate;
          pkg.weekStartIso = pkg.weekStartIso || wk.weekStartIso;
          packageIndex.byId.set(pkg.id, pkg);
          dest._leaves.push(pkg);
          packageIndex.root._leaves.push(pkg);
        });
      });
    });
  });

  packageFilterKey = '';
  visibleRowLimit = ROW_RENDER_BATCH;
}

function currentFilterKey() {
  if (typeof Filters === 'undefined' || !Filters.getActiveFilters) return '{}';
  const f = Filters.getActiveFilters();
  return JSON.stringify({
    brand: (f.brand || []).slice().sort(),
    region: (f.region || []).slice().sort(),
    destination: (f.destination || []).slice().sort(),
    rm: (f.rm || []).slice().sort(),
    hotel: Filters.getSelected('fHotel').slice().sort(),
    gateway: Filters.getSelected('fGateway').slice().sort(),
    nights: Filters.getSelected('fNights').slice().sort(),
    dates: f.dates && f.dates.start
      ? [f.dates.start.getTime(), (f.dates.end || f.dates.start).getTime()]
      : null,
  });
}

function currentRenderKey() {
  return `${currentFilterKey()}::${priceRevision}`;
}

function clearNodeCacheForFilterChange(nextFilterKey) {
  if (nextFilterKey === packageFilterKey) return;
  packageFilterKey = nextFilterKey;
  visibleRowLimit = ROW_RENDER_BATCH;
}

function filteredLeavesFor(node) {
  const key = currentFilterKey();
  if (node._filteredKey === key) return node._filteredLeaves;
  const leaves = (node._leaves || []).filter(passesHeaderFilters);
  node._filteredKey = key;
  node._filteredLeaves = leaves;
  return leaves;
}

// Return every leaf (single package) in PACKAGE_DATA that passes header filters.
function allLeaves() {
  return filteredLeavesFor(packageIndex.root);
}

/* ══════════════════════════════════════════════════════════════════
   Packages table (flat — one row per package)

   NOTE: Flight #, Time dep./arr. and Bagg. columns are intentionally
   blank — the package CSV export carries no per-flight schedule or
   baggage data, so we show the columns but never fabricate values.
   ══════════════════════════════════════════════════════════════════ */
const COLSPAN = 20;
function renderPackagesHead() {
  document.getElementById('packagesHead').innerHTML = `
    <tr>
      <th style="min-width:120px;">Destination</th>
      <th style="min-width:220px;">Hotel</th>
      <th style="width:46px;text-align:center;">Nt</th>
      <th style="width:104px;">Dates</th>
      <th style="min-width:150px;">Gateway</th>
      <th style="width:78px;">Flight #</th>
      <th class="text-right" style="width:72px;" title="Sold same time last year — no CSV column yet">Sold STLY</th>
      <th class="text-right" style="width:70px;">Sold</th>
      <th class="text-right" style="width:70px;" title="Outbound flight forecast load factor">Out Fcst</th>
      <th class="text-right" style="width:70px;" title="Return flight forecast load factor">Ret Fcst</th>
      <th class="text-right" style="width:70px;" title="Hotel forecast — no CSV column yet">Hotel Fcst</th>
      <th class="text-right" style="width:64px;" title="Pickup pax, trailing 7 days">Pickup 7d</th>
      <th class="text-right" style="width:64px;" title="Pickup pax, trailing 14 days">Pickup 14d</th>
      <th class="text-right" style="width:118px;">Price</th>
      <th class="text-right" style="width:104px;">Rec Price</th>
      <th class="text-right" style="width:72px;">Δ $</th>
      <th class="text-right" style="width:96px;">Curr Margin</th>
      <th class="text-right" style="width:96px;">Rec Margin</th>
      <th class="text-right" style="width:72px;">Margin Δ</th>
      <th style="width:90px;">Pace</th>
    </tr>
  `;
}

const BLANK_CELL = '<td style="text-align:center;color:var(--border-mid);">—</td>';
function renderPackagesTable() {
  const tbody = document.getElementById('packagesBody');
  clearNodeCacheForFilterChange(currentFilterKey());

  // Empty state only when no package data is loaded (CSV failed / not connected).
  if (!PACKAGE_DATA.length) {
    tbody.innerHTML = `<tr><td colspan="${COLSPAN}" style="padding:40px;text-align:center;color:var(--text-muted);">
      No package data available — not yet connected to a data source.
    </td></tr>`;
    return;
  }

  const leaves = allLeaves();
  if (!leaves.length) {
    tbody.innerHTML = `<tr><td colspan="${COLSPAN}" style="padding:28px;text-align:center;color:var(--text-muted);">No packages match the current filters.</td></tr>`;
    return;
  }

  const rendered = leaves.slice(0, visibleRowLimit);
  const rows = rendered.map(p => {
    const currP  = getEffectivePrice(p);
    const currM  = getEffectiveMargin(p);
    const deltaP = p.recPrice - currP;
    const deltaM = p.recMargin - currM;
    const recAccepted = acceptedRecs.has(p.id);
    const isLocked = lockedPkgs.has(p.id);
    const showWas  = p.regularPrice > currP;

    return `
      <tr class="row-unit">
        <td>
          <div style="line-height:1.25;">
            <div>
              ${p.hasCostChange ? `<span class="cost-change-icon" title="Cost change since last evaluation" style="margin-right:5px;">&#9888;</span>` : ''}
              <span style="font-weight:500;">${p.destination}</span>
            </div>
            <div style="margin-top:3px;"><span class="region-badge ${regionClass(p.region)}">${p.region}</span></div>
          </div>
        </td>
        <td>
          <div style="display:flex;flex-direction:column;gap:2px;line-height:1.25;">
            <span style="font-weight:600;">${p.hotel}</span>
            ${starRating(p.hotelStars)}
            <div style="font-size:11px;color:var(--text-secondary);">
              ${p.roomCategory || '—'}${p.mealPlan ? ` <span style="color:var(--text-muted);">· ${p.mealPlan}</span>` : ''}
            </div>
          </div>
        </td>
        <td style="text-align:center;">${durPill(p.duration)}</td>
        <td>
          <div style="line-height:1.3;font-family:var(--font-mono);font-size:11px;">
            <div>${dayMon(p.departureDate) || '—'}</div>
            <div style="color:var(--text-muted);">${dayMon(p.returnDate) || ''}</div>
          </div>
        </td>
        <td>
          <div style="line-height:1.25;">
            <div style="font-size:12px;">${p.gatewayCity}</div>
            <div style="font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);">${p.gateway}</div>
          </div>
        </td>
        ${BLANK_CELL}
        <td class="text-right num" style="color:var(--border-mid);">—</td>
        <td class="text-right num">${p.soldPackages}</td>
        <td class="text-right num">${p.outboundForecastLf == null ? '—' : fmtPct(p.outboundForecastLf)}</td>
        <td class="text-right num">${p.returnForecastLf == null ? '—' : fmtPct(p.returnForecastLf)}</td>
        <td class="text-right num" style="color:var(--border-mid);">—</td>
        <td class="text-right num">${p.pickupPax7d == null ? '—' : p.pickupPax7d}</td>
        <td class="text-right num">${p.pickupPax14d == null ? '—' : p.pickupPax14d}</td>
        <td class="text-right">
          <input class="price-input" type="number" step="1" value="${Math.round(currP)}"
                 onclick="event.stopPropagation()"
                 onchange="updatePrice('${p.id}', this.value)"
                 ${isLocked ? 'disabled' : ''} />
          ${showWas ? `<div class="price-was">${fmt$(p.regularPrice)}</div>` : ''}
        </td>
        <td class="text-right">
          <span class="rec-click ${recAccepted?'accepted':''}"
                onclick="event.stopPropagation();${recAccepted?'':`acceptRec('${p.id}')`}">
            ${fmt$(p.recPrice)}
          </span>
        </td>
        <td class="text-right num ${deltaColor(deltaP)}">${deltaP>=0?'+':''}${fmt$(deltaP)}</td>
        <td class="text-right">
          <input class="price-input" type="number" step="1" value="${Math.round(currM)}"
                 onclick="event.stopPropagation()"
                 onchange="updateMargin('${p.id}', this.value)"
                 ${isLocked ? 'disabled' : ''} />
        </td>
        <td class="text-right num" style="color:var(--accent);">${fmt$(p.recMargin)}</td>
        <td class="text-right num ${deltaColor(deltaM)}">${deltaM>=0?'+':''}${fmt$(deltaM)}</td>
        <td>${paceBadge(p.bookingPace)}</td>
      </tr>
    `;
  });

  if (leaves.length > rendered.length) {
    const nextCount = Math.min(leaves.length, rendered.length + ROW_RENDER_BATCH);
    rows.push(`
      <tr>
        <td colspan="${COLSPAN}" style="padding:14px 16px;text-align:center;color:var(--text-secondary);">
          Showing ${rendered.length.toLocaleString()} of ${leaves.length.toLocaleString()} packages.
          <button class="btn btn-ghost" style="margin-left:10px;" onclick="showMorePackages()">Show next ${(nextCount - rendered.length).toLocaleString()}</button>
        </td>
      </tr>
    `);
  }

  tbody.innerHTML = rows.join('');
}

function showMorePackages() {
  visibleRowLimit += ROW_RENDER_BATCH;
  renderPackagesTable();
}

/* ══════════════════════════════════════════════════════════════════
   Inline price edit / accept rec / lock
   ══════════════════════════════════════════════════════════════════ */
function updatePrice(pkgId, value) {
  const v = Number(value);
  if (isNaN(v)) return;
  priceOverrides[pkgId] = v;
  acceptedRecs.delete(pkgId);
  priceRevision++;
  renderPackagesTable();
}
// Price and margin are linked by margin = price - totalCost. Price is the single
// source of truth (priceOverrides), so a margin edit back-solves the price.
function updateMargin(pkgId, value) {
  const v = Number(value);
  if (isNaN(v)) return;
  const p = packageIndex.byId.get(pkgId);
  if (!p) return;
  priceOverrides[pkgId] = v + p.totalCost;
  acceptedRecs.delete(pkgId);
  priceRevision++;
  renderPackagesTable();
}
function acceptRec(pkgId) {
  const p = packageIndex.byId.get(pkgId);
  if (!p) return;
  priceOverrides[pkgId] = p.recPrice;
  acceptedRecs.add(pkgId);
  priceRevision++;
  renderPackagesTable();
}
function toggleLock(pkgId) {
  lockedPkgs.has(pkgId) ? lockedPkgs.delete(pkgId) : lockedPkgs.add(pkgId);
  renderPackagesTable();
}

/* ══════════════════════════════════════════════════════════════════
   Per-package Rules Drawer
   ══════════════════════════════════════════════════════════════════ */
function openPkgRules(pkgId) {
  activeRuleKey = pkgId;
  const p = packageIndex.byId.get(pkgId);
  if (!p) return;
  document.getElementById('prdSub').textContent = `${p.packageName} · ${p.gateway} → ${p.destId}`;
  const existing = pkgRules[pkgId] || {};
  document.getElementById('prdMinPrice').value  = existing.minPrice  ?? '';
  document.getElementById('prdMaxPrice').value  = existing.maxPrice  ?? '';
  document.getElementById('prdMinMargin').value = existing.minMargin ?? '';
  document.getElementById('prdMaxMargin').value = existing.maxMargin ?? '';
  document.getElementById('prdLock').checked    = lockedPkgs.has(pkgId);
  document.getElementById('prdFlag').checked    = !!existing.flag;
  document.getElementById('prdMeta').innerHTML = existing.modifiedAt
    ? `Last modified ${existing.modifiedAt} by ${existing.modifiedBy}`
    : 'No rules saved yet for this package.';
  document.getElementById('pkgRulesDrawer').classList.add('open');
  document.getElementById('prdBackdrop').classList.add('open');
}
function closePkgRules() {
  document.getElementById('pkgRulesDrawer').classList.remove('open');
  document.getElementById('prdBackdrop').classList.remove('open');
  activeRuleKey = null;
}
function savePkgRules() {
  if (!activeRuleKey) return;
  const now = new Date();
  const stamp = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}/${String(now.getFullYear()).slice(-2)} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const numOrNull = (v) => { const n = Number(v); return isNaN(n) || v === '' ? null : n; };
  pkgRules[activeRuleKey] = {
    minPrice:  numOrNull(document.getElementById('prdMinPrice').value),
    maxPrice:  numOrNull(document.getElementById('prdMaxPrice').value),
    minMargin: numOrNull(document.getElementById('prdMinMargin').value),
    maxMargin: numOrNull(document.getElementById('prdMaxMargin').value),
    flag:      document.getElementById('prdFlag').checked,
    modifiedAt: stamp,
    modifiedBy: 'Sarah Chen',
  };
  // Mirror lock toggle to lockedPkgs
  if (document.getElementById('prdLock').checked) lockedPkgs.add(activeRuleKey);
  else lockedPkgs.delete(activeRuleKey);
  closePkgRules();
  renderPackagesTable();
}

/* ══════════════════════════════════════════════════════════════════
   Notes modal
   ══════════════════════════════════════════════════════════════════ */
function openNotesModal(pkgId) {
  activeNoteKey = pkgId;
  const p = packageIndex.byId.get(pkgId);
  document.getElementById('notesModalSub').textContent = p ? `${p.packageName} · ${p.checkInWeek}` : pkgId;
  const existing = notes[pkgId];
  document.getElementById('notesText').value       = existing ? existing.text : '';
  document.getElementById('notesExpiry').value     = existing ? existing.expires : '';
  document.getElementById('notesCreatedBy').value  = existing ? existing.createdBy : 'Sarah Chen';
  document.getElementById('notesCreatedAt').textContent = existing ? `Created: ${existing.createdAt}` : 'Created: —';
  document.getElementById('notesDeleteBtn').style.display = existing ? 'inline-flex' : 'none';
  document.getElementById('notesModalBackdrop').classList.add('open');
}
function closeNotesModal() {
  document.getElementById('notesModalBackdrop').classList.remove('open');
  activeNoteKey = null;
}
function saveNote() {
  if (!activeNoteKey) return;
  const text = document.getElementById('notesText').value.trim();
  if (!text) { closeNotesModal(); return; }
  const expires   = document.getElementById('notesExpiry').value;
  const createdBy = document.getElementById('notesCreatedBy').value;
  const existing  = notes[activeNoteKey];
  const now       = new Date();
  const createdAt = existing ? existing.createdAt
    : `${now.toLocaleDateString('en-CA')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  notes[activeNoteKey] = { text, expires, createdBy, createdAt };
  closeNotesModal();
  renderPackagesTable();
}
function deleteNote() {
  if (!activeNoteKey) return;
  delete notes[activeNoteKey];
  closeNotesModal();
  renderPackagesTable();
}

/* ══════════════════════════════════════════════════════════════════
   Run Evaluation modal
   ══════════════════════════════════════════════════════════════════ */
const _RE_DURATIONS = [7, 10, 14];
function runEvaluation() {
  // Populate destinations / gateways from the nested tree
  const destSet = new Set(PACKAGE_DATA.map(d => d.name));
  document.getElementById('reDestList').innerHTML = Array.from(destSet).sort().map(d =>
    `<label><input type="checkbox" class="re-dest-cb" value="${d}" checked onchange="onReScopeChange()"> ${d}</label>`
  ).join('');
  const gwSet = new Set();
  allLeaves().forEach(p => gwSet.add(p.gateway));
  document.getElementById('reGatewayList').innerHTML = Array.from(gwSet).sort().map(g =>
    `<label><input type="checkbox" class="re-gw-cb" value="${g}" checked onchange="onReScopeChange()"> ${g}</label>`
  ).join('');
  // Populate durations
  document.getElementById('reDurList').innerHTML = _RE_DURATIONS.map(d =>
    `<label><input type="checkbox" class="re-dur-cb" value="${d}" checked onchange="onReScopeChange()"> ${d} nights</label>`
  ).join('');
  // Reset defaults
  ['reAllDests','reAllGateways','reAllDurations','reOptRules','reOptComp','reOptFlag'].forEach(id => { document.getElementById(id).checked = true; });
  document.getElementById('reOptNotify').checked = false;
  ['reDestList','reGatewayList','reDurList'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  onReScopeChange();
  document.getElementById('reBackdrop').classList.add('open');
}
function closeRunEvalModal() {
  document.getElementById('reBackdrop').classList.remove('open');
}
function onReScopeChange() {
  const allDests = document.getElementById('reAllDests').checked;
  const allGws   = document.getElementById('reAllGateways').checked;
  const allDurs  = document.getElementById('reAllDurations').checked;
  document.getElementById('reDestList').style.display    = allDests ? 'none' : 'grid';
  document.getElementById('reGatewayList').style.display = allGws   ? 'none' : 'grid';
  document.getElementById('reDurList').style.display     = allDurs  ? 'none' : 'grid';

  const selDests = allDests
    ? new Set(PACKAGE_DATA.map(d => d.name))
    : new Set(Array.from(document.querySelectorAll('.re-dest-cb:checked')).map(cb => cb.value));
  const allGwSet = new Set();
  allLeaves().forEach(p => allGwSet.add(p.gateway));
  const selGws   = allGws
    ? allGwSet
    : new Set(Array.from(document.querySelectorAll('.re-gw-cb:checked')).map(cb => cb.value));
  const selDurs  = allDurs
    ? new Set(_RE_DURATIONS)
    : new Set(Array.from(document.querySelectorAll('.re-dur-cb:checked')).map(cb => Number(cb.value)));

  const nPkgs = allLeaves().filter(p =>
    selDests.has(p.destination) && selGws.has(p.gateway) && selDurs.has(p.duration)
  ).length;

  document.getElementById('rePreview').innerHTML =
    `This will evaluate <strong>${nPkgs}</strong> packages across <strong>${selDests.size}</strong> destinations × <strong>${selGws.size}</strong> gateways × <strong>${selDurs.size}</strong> durations`;
}
function confirmRunEvaluation() {
  closeRunEvalModal();
  const toast = document.getElementById('reToast');
  const text  = document.getElementById('reToastText');
  toast.classList.remove('success');
  text.textContent = '⟳ Evaluation running…';
  toast.classList.add('shown');
  setTimeout(() => {
    const nPkgs = allLeaves().length;
    toast.classList.add('success');
    text.textContent = `✓ Evaluation complete — ${nPkgs} recommendations updated`;
    setTimeout(() => {
      toast.classList.remove('shown');
      toast.classList.remove('success');
    }, 3000);
  }, 2500);
}

function bookVia(channel) {
  const toast = document.getElementById('reToast');
  const text  = document.getElementById('reToastText');
  toast.classList.add('success');
  text.textContent = `✓ Opening ${channel} booking channel…`;
  toast.classList.add('shown');
  setTimeout(() => { toast.classList.remove('shown'); toast.classList.remove('success'); }, 2000);
}

function publishChanges() {
  const n = Object.keys(priceOverrides).length;
  const toast = document.getElementById('reToast');
  const text  = document.getElementById('reToastText');
  if (n === 0) {
    toast.classList.add('success');
    text.textContent = '✓ No pending changes to publish';
  } else {
    toast.classList.add('success');
    text.textContent = `✓ Published ${n} price change${n===1?'':'s'}`;
  }
  toast.classList.add('shown');
  setTimeout(() => { toast.classList.remove('shown'); toast.classList.remove('success'); }, 2500);
}

/* ══════════════════════════════════════════════════════════════════
   Nav / shell wiring
   ══════════════════════════════════════════════════════════════════ */
function toggleFilter(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const open = el.classList.contains('open');
  document.querySelectorAll('.ms-wrap.open').forEach(w => w.classList.remove('open'));
  if (!open) el.classList.add('open');
}
function toggleMenu() { document.getElementById('navDropdown').classList.toggle('open'); }

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-wrap.open').forEach(w => w.classList.remove('open'));
  }
  if (!e.target.closest('#menuBtn') && !e.target.closest('#navDropdown')) {
    document.getElementById('navDropdown').classList.remove('open');
  }
});

/* ══════════════════════════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════════════════════════ */
function _initPricing() {
  rebuildPackageIndex();
  Filters.populateStandard({
    onAnyChange: () => {
      visibleRowLimit = ROW_RENDER_BATCH;
      renderPackagesTable();
    }
  });
  // Region options come from the loaded package CSV.
  if (window.__filterRegions && window.__filterRegions.length && Filters.setMultiSelectValues) {
    Filters.setMultiSelectValues('fRegion', window.__filterRegions);
  }
  _initPackageFilters();
  renderPackagesHead();
  renderPackagesTable();
}

// Hotel / Gateway / Nights filters are package-specific — their option lists are
// derived from the loaded package leaves rather than the shared filter contract.
function _initPackageFilters() {
  const leaves = packageIndex.root._leaves || [];
  const reRender = () => { visibleRowLimit = ROW_RENDER_BATCH; renderPackagesTable(); };
  const uniq = (arr) => Array.from(new Set(arr.filter(v => v != null && v !== '')));
  const hotels   = uniq(leaves.map(p => p.hotel)).sort();
  const gateways = uniq(leaves.map(p => p.gatewayCity)).sort();
  const nights   = uniq(leaves.map(p => p.duration)).sort((a, b) => a - b).map(d => `${d}N`);
  Filters.initMultiSelect('fHotel',   hotels,   { defaultLabel: 'All Hotels',   onChange: reRender });
  Filters.initMultiSelect('fGateway', gateways, { defaultLabel: 'All Gateways', onChange: reRender });
  Filters.initMultiSelect('fNights',  nights,   { defaultLabel: 'All Nights',   onChange: reRender });
}

// Load ONLY the package CSV (not the hotel/flight exports), then render.
if (typeof loadPackageData === 'function') {
  loadPackageData()
    .then(rows => {
      window.__packageRows = rows;
      const meta = DataLoader.applyPackagesToGlobals(rows);
      window.__filterRegions = meta && meta.regions;
      console.info(`[pricing] ${rows.length} package rows loaded into ${PACKAGE_DATA.length} destinations`);
    })
    .catch(err => console.warn('[pricing] package CSV load failed — rendering empty state:', err))
    .finally(_initPricing);
} else {
  console.warn('[pricing] data-loader.js unavailable — rendering empty data.js contract.');
  _initPricing();
}
</script>
